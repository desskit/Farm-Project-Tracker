# Farm Project Tracker — self-hosted stack (app + Caddy reverse proxy).
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      # See the Dockerfile: without this the healthcheck can't reach the app.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/data/app.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      # Required: "today", due dates and every scheduled job use the farm's
      # local date. Compose refuses to start without it rather than quietly
      # running on UTC (set ALLOW_UTC=1 if UTC really is intended).
      TZ: ${TZ:?Set TZ in .env to the farm timezone, e.g. TZ=America/Chicago}
      ALLOW_UTC: ${ALLOW_UTC:-}
      # The app is only reachable through Caddy, so its X-Forwarded-For is
      # trusted for per-IP login throttling. Set 0 if port 3000 is ever exposed.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PUBLIC_URL: ${PUBLIC_URL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # optional integrations (blank = feature disabled)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - farmdata:/data
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  farmdata:
  caddydata:
  caddyconfig:
